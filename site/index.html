<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRS XML Generator</title>
    <link rel="stylesheet" href="assets/main.css" />
  </head>
  <body>
    <header>
      <h1>DRS XML Generator</h1>
      <p>
        This web app takes in XLS files from the Digital Library and creates an
        XML file ready for submitting to CrossRef to register or update DOI
        information.
      </p>
    </header>
    <main>
      <p>Here you'll upload your things and then work on it.</p>
      <input type="file" id="file" accept=".xls,.xlsx" />
      <pre id="output"></pre>
    </main>
    <script type="module" src="assets/main.js"></script>
  </body>
</html>
